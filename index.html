function resolveSupabaseUrl(raw){
  const v = (raw || "").trim();
  if (!v || v === "YOUR_SUPABASE_URL") return "";
  if (v.startsWith("http")) return v;
  // 容错:用户可能只填了项目 ID(如 "dzxzgrfxtnzhqfgnyemh"),自动补全成完整域名

function addMonths(date, n){ const d = new Date(date); d.setMonth(d.getMonth()+n); return d; }
function countPeriodsPassed(baseDateStr, dueDay, today){
  const base = new Date(baseDateStr);
  let d = new Date(base.getFullYear(), base.getMonth(), dueDay || 1);
  if (d <= base) d = addMonths(d, 1);
  let k = 0;
  while (d <= today) { k++; d = addMonths(d, 1); }
  return k;
}
function computeRemaining(item, today){
  if (item.status === "paid") return 0;
  const P0 = Number(item.basePrincipal) || 0;
  const n = Math.max(0, Number(item.remainingTermsAtBase) || 0);
  const A = Number(item.monthlyPayment) || 0;
  const rate = Number(item.rate) || 0;
  const r = rate/100/12;
  let k = countPeriodsPassed(item.baseDate, item.dueDay, today);
  k = Math.min(k, n);
  if (n <= 0) return Math.max(0, P0);
  let balance;
  if (item.method === "interest_free" || r === 0) balance = P0 - (P0/n)*k;
  else if (item.method === "equal_principal") balance = P0 - (P0/n)*k;
  else balance = P0*Math.pow(1+r,k) - (A*(Math.pow(1+r,k)-1))/r;
  return Math.max(0, Math.round(balance));
}
function daysUntilNext(monthDay){
  if (!monthDay) return null;
  const [m,d] = monthDay.split("-").map(Number);
  const now = new Date();
  let next = new Date(now.getFullYear(), m-1, d);
  if (next < now) next = new Date(now.getFullYear()+1, m-1, d);
  return Math.ceil((next-now)/86400000);
}
function impliedMonthlyRate(P0, A, n){
  if (!(n>0) || !(P0>0) || !(A>0)) return null;
  const f = (r) => r===0 ? A*n - P0 : A*(1-Math.pow(1+r,-n))/r - P0;
  if (f(0) < 0) return null;
  let lo = 0, hi = 0.05;
  for (let i=0; i<100; i++){
    const mid = (lo+hi)/2;
    const fm = f(mid);
    if (Math.abs(fm) < 1e-6) return mid;
    if (fm > 0) lo = mid; else hi = mid;
  }
  return (lo+hi)/2;
}

        console.error("Supabase 读取失败,本次修改不会保存", e);
        this.dbConnected = false;
        this.dbError = ((e && e.message) || String(e)) + " | 实际连接的地址 = " + RESOLVED_SUPABASE_URL;
        this.data = seedData();
      }
    } else {
      this.dbConnected = false;
      this.dbError = "当前页面读到的 SUPABASE_URL 原始值 = \"" + SUPABASE_URL + "\",无法解析成有效网址。请确认已填成完整的 https://xxxx.supabase.co 或至少是项目ID本身。";
      this.data = seedData();
    }
    if (!this.data.income) this.data.income = [];
    try {
      const savedUser = localStorage.getItem("wealth-current-user");
      if (savedUser && this.data.familyMembers.includes(savedUser)) {
        this.currentUser = savedUser;
        this.ownerFilter = savedUser;
      }
    } catch(e){}
    this.render();

  async persist(){
    if (!sb){
      this.lastSaveOk = false;
      this.showSaveToast("⚠️ 未连接数据库,这次修改只在当前页面里,刷新就会丢失");

      if (error) throw error;
      this.dbConnected = true;
      this.lastSaveOk = true;
      this.showSaveToast("✓ 已保存");
      return true;
    } catch(e){
      console.error("保存失败", e);
      this.lastSaveOk = false;
      this.showSaveToast("✗ 保存失败: " + ((e&&e.message)||"未知错误") + "(修改暂时只在本页面生效,刷新会丢失)");

  totals(ownerFilter){
    const today = new Date();
    const matches = (item) => !ownerFilter || ownerFilter==="全部" || (item.owner||"共同")===ownerFilter;
    const loanTotal = this.data.loans.filter(l=>l.status!=="paid" && matches(l)).reduce((s,l)=>s+computeRemaining(l,today),0);
    const cardInstallTotal = this.data.cards.filter(matches).reduce((s,c)=>s+c.installments.reduce((s2,i)=>s2+computeRemaining(i,today),0),0);
    const cardBillTotal = this.data.cards.filter(matches).reduce((s,c)=>s+(Number(c.currentBillManual)||0),0);
    const cardLimitTotal = this.data.cards.filter(matches).reduce((s,c)=>s+(Number(c.totalLimit)||0),0);
    const totalLiabilities = loanTotal+cardInstallTotal+cardBillTotal;
    const assetTotal = this.data.assets.filter(matches).reduce((s,a)=>s+(Number(a.currentValue)||0),0);
    const insAssetTotal = this.data.insurance.filter(i=>i.type==="savings"&&i.includeInNetWorth&&matches(i)).reduce((s,i)=>s+(Number(i.cashValue)||0),0);
    const totalAssets = assetTotal+insAssetTotal;
    const netWorth = totalAssets-totalLiabilities;
    const loanMonthly = this.data.loans.filter(l=>l.status!=="paid"&&matches(l)).reduce((s,l)=>s+(Number(l.monthlyPayment)||0),0);
    const cardMonthly = this.data.cards.filter(matches).reduce((s,c)=>s+c.installments.reduce((s2,i)=>s2+(Number(i.monthlyPayment)||0),0),0);
    const incomeMonthly = (this.data.income||[]).filter(matches).reduce((s,i)=>s+((Number(i.amount)||0)/(i.frequency==="annual"?12:1)),0);
    return {loanTotal,cardInstallTotal,cardBillTotal,cardLimitTotal,totalLiabilities,assetTotal,insAssetTotal,totalAssets,netWorth,loanMonthly,cardMonthly,incomeMonthly};
  },

  async saveSnapshot(){
    const t = this.totals();
    const d = todayStr();
    this.data.history = this.data.history.filter(x=>x.date!==d);
    this.data.history.push({date:d, totalAssets:t.totalAssets, totalLiabilities:t.totalLiabilities, netWorth:t.netWorth});
    this.data.history.sort((a,b)=> a.date<b.date?-1:1);
    await this.persist();
    this.render();
  },

  solveRateForForm(){
    const P0 = Number(document.getElementById("f_basePrincipal")?.value);
    const A = Number(document.getElementById("f_monthlyPayment")?.value);
    const n = Number(document.getElementById("f_remainingTermsAtBase")?.value);
    const methodEl = document.getElementById("f_method");
    const method = methodEl ? methodEl.value : "equal_installment";
    if (!P0 || !A || !n){
      alert("请先填写「基准剩余本金」「月供/月还款」「基准日剩余期数」这三项,再点反推。");
      return;
    }
    if (method && method !== "equal_installment"){
      alert("目前只支持「等额本息」方式反推利率,其他还款方式请手动填写利率。");
      return;
    }
    const r = impliedMonthlyRate(P0, A, n);
    if (r === null){
      alert("反推失败:月供 × 期数 需要大于本金,请检查数值是否填对。");
      return;
    }
    const annualRate = Math.round(r*12*10000)/100;
    const rateEl = document.getElementById("f_rate");
    if (rateEl) rateEl.value = annualRate;
    if (this.openForm) this.openForm.values.rate = annualRate;
    alert(`已反推年利率约 ${annualRate}%,可以再手动微调。`);
  },

  parseCsvLine(line){
    const result = [];
    let cur = "", inQuotes = false;
    for (let i=0;i<line.length;i++){
      const c = line[i];
      if (inQuotes){
        if (c === '"'){ if (line[i+1] === '"'){ cur+='"'; i++; } else inQuotes=false; }
        else cur+=c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { result.push(cur); cur=""; }
        else cur+=c;
      }
    }
    result.push(cur);
    return result;
  },

  triggerImport(kind, schema){
    this.pendingImportKind = kind;
    this.pendingImportSchema = schema;
    const el = document.getElementById("csv-file-input");
    if (el) el.click();
  },

  handleCsvFile(ev){
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => { this.importCsvText(e.target.result); };
    reader.readAsText(file, "utf-8");
    ev.target.value = "";
  },

  async importCsvText(text){
    const kind = this.pendingImportKind;
    const schema = this.pendingImportSchema;
    if (!kind || !schema) return;
    const lines = text.split(/\r?\n/).filter(l=>l.trim()!=="");
    if (lines.length < 2){ alert("文件里没有数据行(第一行需要是表头)"); return; }
    const headers = this.parseCsvLine(lines[0]).map(h=>h.trim());
    const fullSchema = this.schemaWithOwner(kind, schema);
    let count = 0;
    for (let i=1;i<lines.length;i++){
      const cells = this.parseCsvLine(lines[i]);
      if (cells.every(c=>c.trim()==="")) continue;
      const obj = {};
      headers.forEach((h,idx)=>{
        const field = fullSchema.find(f=>f.label===h || f.key===h);
        if (!field) return;
        let val = (cells[idx]||"").trim();
        if (field.type==="select"){
          const opt = field.options.find(o=>o.label===val || o.value===val);
          val = opt ? opt.value : val;
        } else if (field.type==="checkbox"){
          val = (val==="是" || val.toLowerCase()==="true" || val==="1");
        } else if (field.type==="number"){
          val = val==="" ? undefined : Number(val);
        }
        obj[field.key] = val;
      });
      if (!obj.owner) obj.owner = "共同";
      obj.id = kind[0] + "imp" + Date.now() + "_" + i;
      if (kind==="loan"){ obj.status = obj.status || "active"; this.data.loans.push(obj); }
      else if (kind==="card"){ obj.installments = []; this.data.cards.push(obj); }
      else if (kind==="asset"){ this.data.assets.push(obj); }
      else if (kind==="income"){ this.data.income.push(obj); }
      else if (kind==="insurance"){ this.data.insurance.push(obj); }
      count++;
    }
    this.pendingImportKind = null;
    this.pendingImportSchema = null;
    await this.persist();
    this.render();
    alert(`已导入 ${count} 条记录`);
  },

  ownerField(){
    const opts = this.data.familyMembers.map(n=>({value:n, label:n}));
    opts.push({value:"共同", label:"共同"});
    return {key:"owner", label:"归属", type:"select", options:opts};
  },
  schemaWithOwner(kind, schema){
    return ["loan","card","asset","insurance","income"].includes(kind) ? [...schema, this.ownerField()] : schema;
  },
  openAddForm(kind, schema, defaults, cardId){

  editFamilyMembers(){
    this.identityMenuOpen = false;
    const n1 = prompt("成员1 名称:", this.data.familyMembers[0] || "小桃");
    if (n1===null) { this.render(); return; }
    const n2 = prompt("成员2 名称:", this.data.familyMembers[1] || "小饼");
    if (n2===null) { this.render(); return; }
    const oldNames = [...this.data.familyMembers];
    this.data.familyMembers = [n1.trim()||"小桃", n2.trim()||"小饼"];
    // 如果当前身份是旧名字,同步改成新名字,否则身份会失效
    if (this.currentUser === oldNames[0]) this.currentUser = this.data.familyMembers[0];

    this.persist();
    this.render();

  async submitForm(){
    const of = this.openForm;
    const vals = this.captureFormValues();
    ["basePrincipal","rate","monthlyPayment","dueDay","remainingTermsAtBase","totalLimit","currentBillManual","currentValue","coverageAmount","annualPremium","cashValue","amount"].forEach(k=>{
      if (vals[k]!==undefined && vals[k]!=="") vals[k]=Number(vals[k]);
    });
    if (of.kind==="loan"){
      if (of.mode==="add") this.data.loans.push({...vals, id:"l"+Date.now(), status:"active"});
      else this.data.loans = this.data.loans.map(x=>x.id===of.id?{...x,...vals}:x);
    } else if (of.kind==="card"){
      if (of.mode==="add") this.data.cards.push({...vals, id:"c"+Date.now(), installments:[]});
      else this.data.cards = this.data.cards.map(x=>x.id===of.id?{...x,...vals}:x);
    } else if (of.kind==="installment"){
      const card = this.data.cards.find(c=>c.id===of.cardId);
      if (of.mode==="add") card.installments.push({...vals, id:"i"+Date.now()});
      else card.installments = card.installments.map(x=>x.id===of.id?{...x,...vals}:x);
    } else if (of.kind==="asset"){
      if (of.mode==="add") this.data.assets.push({...vals, id:"a"+Date.now()});
      else this.data.assets = this.data.assets.map(x=>x.id===of.id?{...x,...vals}:x);
    } else if (of.kind==="insurance"){
      if (of.mode==="add") this.data.insurance.push({...vals, id:"ins"+Date.now()});
      else this.data.insurance = this.data.insurance.map(x=>x.id===of.id?{...x,...vals}:x);
    } else if (of.kind==="income"){
      if (of.mode==="add") this.data.income.push({...vals, id:"inc"+Date.now()});
      else this.data.income = this.data.income.map(x=>x.id===of.id?{...x,...vals}:x);
    }
    this.openForm = null;
    await this.persist();
    this.render();
  },

  allDebtRows(sortBy){
    const today = new Date();
    const rows = [];
    this.data.loans.filter(l=>l.status!=="paid").forEach(l=>{
      const n = Number(l.remainingTermsAtBase)||0;
      const k = countPeriodsPassed(l.baseDate, l.dueDay, today);
      rows.push({name:l.name, owner:l.owner||"共同", rate:l.rate, remaining:computeRemaining(l,today), monthlyPayment:l.monthlyPayment, dueDay:l.dueDay, termsLeft: Math.max(0, n-Math.min(k,n))});
    });
    this.data.cards.forEach(c=>{
      c.installments.forEach(i=>{
        const n = Number(i.remainingTermsAtBase)||0;
        const k = countPeriodsPassed(i.baseDate, c.dueDay, today);
        rows.push({name:`${c.name}·${i.label}`, owner:c.owner||"共同", rate:i.rate, remaining:computeRemaining(i,today), monthlyPayment:i.monthlyPayment, dueDay:c.dueDay, termsLeft: Math.max(0, n-Math.min(k,n))});
      });
      if (Number(c.currentBillManual)>0){
        rows.push({name:`${c.name}·当期账单`, owner:c.owner||"共同", rate:null, remaining:Number(c.currentBillManual), monthlyPayment:0, dueDay:c.dueDay, termsLeft:null});
      }
    });
    const by = sortBy || this.debtSort || "term";
    if (by === "rate") rows.sort((a,b)=>(b.rate||0)-(a.rate||0));
    else if (by === "payment") rows.sort((a,b)=>(b.monthlyPayment||0)-(a.monthlyPayment||0));
    else rows.sort((a,b)=>(a.termsLeft===null?Infinity:a.termsLeft)-(b.termsLeft===null?Infinity:b.termsLeft));
    return rows;
  },

  async getAiAdvice(){
    this.aiLoading = true;
    this.aiAdvice = null;
    this.render();
    try {
      const debts = this.allDebtRows();
      const t = this.totals();
      const income = {
        familyMonthly: t.incomeMonthly,
        byOwner: [...this.data.familyMembers, "共同"].map(o=>({owner:o, monthly:this.totals(o).incomeMonthly})),
      };
      const res = await fetch("/.netlify/functions/debt-advice", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({debts, income}),
      });
      const data = await res.json();
      this.aiAdvice = data.advice || data.error || "生成失败,请稍后重试。";
    } catch(e){
      this.aiAdvice = "请求失败:" + e.message + "(检查是否已部署 Netlify Function 并配置 DEEPSEEK_API_KEY)";
    }
    this.aiLoading = false;
    this.render();
  },

              <span class="chip">${this.ownerEmoji(i.owner||"共同")} ${i.owner||"共同"}</span>
              <span class="chip">${freqLabel[i.frequency]||i.frequency}</span>
              ${i.note ? `<span class="chip">${i.note}</span>` : ""}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="font-size:18px;font-weight:700;">¥${fmt(i.amount)}</div>
            ${editable ? `
              <button class="icon-btn" onclick='App.openEditForm("income", INCOME_SCHEMA, ${JSON.stringify(i)})'>编辑</button>
              <button class="icon-btn" onclick="App.deleteItem('income','${i.id}')">🗑️</button>
            ` : `<span class="muted">仅本人可编辑</span>`}
          </div>
        </div>`;
      }).join("")}`;
  },

  renderAssets(){
    const addForm = (this.openForm && this.openForm.kind==="asset" && this.openForm.mode==="add") ? this.renderFormInner() : "";
    const catLabel = {cash:"现金/存款", fixed:"固定资产", invest:"投资"};
    return `
      <div class="section-head">
        <div><div class="title">📈 资产</div><div class="subtitle">现金、固定资产、投资,几天到一两个月核对一次即可</div></div>
        <div style="display:flex;gap:8px;">
          <button class="btn-ghost" onclick="App.triggerImport('asset', ASSET_SCHEMA)">📥 导入CSV</button>
          <button class="btn-primary" onclick="App.openAddForm('asset', ASSET_SCHEMA, {category:'cash', lastUpdated: todayStr()})">➕ 添加资产</button>
        </div>
      </div>
      ${this.renderOwnerChips()}
      ${addForm}
      ${this.data.assets.length===0 ? '<div class="muted">还没有资产记录,点右上角添加第一项吧。</div>' : ""}
      ${this.data.assets.filter(a=>this.matchOwner(a)).map(a=>{
        if (this.openForm && this.openForm.kind==="asset" && this.openForm.mode==="edit" && this.openForm.id===a.id) return `<div class="card">${this.renderFormInner()}</div>`;
        return `<div class="card row-between">
          <div>
            <div style="font-weight:600;">${a.name}</div>
            <div class="chip-row">
              <span class="chip">${this.ownerEmoji(a.owner||"共同")} ${a.owner||"共同"}</span>
              <span class="chip">${catLabel[a.category]||a.category}</span>
              <span class="chip">更新于 ${a.lastUpdated||""}</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="font-size:18px;font-weight:700;">¥${fmt(a.currentValue)}</div>
            ${this.canEdit(a) ? `
              <button class="icon-btn" onclick='App.openEditForm("asset", ASSET_SCHEMA, ${JSON.stringify(a)})'>编辑</button>
              <button class="icon-btn" onclick="App.deleteItem('asset','${a.id}')">🗑️</button>
            ` : `<span class="muted">仅${a.owner}可编辑</span>`}
          </div>
        </div>`;
      }).join("")}`;
  },

  renderInsurance(){
    const addForm = (this.openForm && this.openForm.kind==="insurance" && this.openForm.mode==="add") ? this.renderFormInner() : "";
    return `
      <div class="section-head">
        <div><div class="title">🛡️ 保险</div><div class="subtitle">消费型只做提醒;储蓄/年金型可选择是否计入净值</div></div>
        <button class="btn-primary" onclick="App.openAddForm('insurance', INSURANCE_SCHEMA, {type:'consumption', status:'active'})">➕ 添加保单</button>
      </div>
      ${this.renderOwnerChips()}
      ${addForm}
      ${this.data.insurance.length===0 ? '<div class="muted">还没有保单记录,点右上角添加第一份吧。</div>' : ""}
      ${this.data.insurance.filter(i=>this.matchOwner(i)).map(i=>{
        if (this.openForm && this.openForm.kind==="insurance" && this.openForm.mode==="edit" && this.openForm.id===i.id) return `<div class="card">${this.renderFormInner()}</div>`;
        return `<div class="card row-between">
          <div>
            <div style="font-weight:600;">${i.name}</div>
            <div class="chip-row">
              <span class="chip">${this.ownerEmoji(i.owner||"共同")} ${i.owner||"共同"}</span>
              <span class="chip">${i.type==="savings"?"储蓄/年金型":"消费型"}</span>
              <span class="chip">保额 <b>¥${fmt(i.coverageAmount)}</b></span>
              <span class="chip">年缴 <b>¥${fmt(i.annualPremium)}</b></span>
              <span class="chip">缴费日 ${i.paymentDate||""}</span>
              <span class="chip">${i.status==="active"?"生效中":"已终止"}</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            ${(i.type==="savings"&&i.includeInNetWorth) ? `<div style="font-size:18px;font-weight:700;">¥${fmt(i.cashValue)}</div>` : ""}
            ${this.canEdit(i) ? `
              <button class="icon-btn" onclick='App.openEditForm("insurance", INSURANCE_SCHEMA, ${JSON.stringify(i)})'>编辑</button>
              <button class="icon-btn" onclick="App.deleteItem('insurance','${i.id}')">🗑️</button>
            ` : `<span class="muted">仅${i.owner}可编辑</span>`}
          </div>
        </div>`;
      }).join("")}`;
  },

  renderHistory(){
    if (this.data.history.length===0){
      return `
        <div class="section-head"><div><div class="title">📊 净值趋势</div><div class="subtitle">记录每次的家庭净值(总资产-总负债),连起来就是这段时间的变化曲线。在总览页点「保存今日快照」就会往这里加一个点</div></div></div>
        <div class="muted">还没有历史快照,去总览页点「保存今日快照」开始记录吧。</div>`;
    }
    const rows = [...this.data.history].reverse().map(h=>`
      <tr><td>${h.date}</td><td>¥${fmt(h.totalAssets)}</td><td>¥${fmt(h.totalLiabilities)}</td>
      <td style="color:${h.netWorth>=0?'var(--positive)':'var(--negative)'};font-weight:600;">¥${fmt(h.netWorth)}</td></tr>`).join("");
    return `
      <div class="section-head"><div><div class="title">📊 净值趋势</div><div class="subtitle">家庭净值(总资产-总负债)随时间的变化,每次保存快照多一个点</div></div></div>
      <div class="card" style="height:260px;padding:16px 8px;"><canvas id="trendChart"></canvas></div>
      <div class="table-wrap"><table style="margin-top:12px;"><thead><tr><th>日期</th><th>总资产</th><th>总负债</th><th>净值</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  },

  drawChart(){
    const ctx = document.getElementById("trendChart");
    if (!ctx) return;
    if (this.chart) this.chart.destroy();
    this.chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: this.data.history.map(h=>h.date),
        datasets: [{
          label: "净值",
          data: this.data.history.map(h=>h.netWorth),
          borderColor: "#B75E37",
          backgroundColor: "rgba(183,94,55,0.1)",
          tension: 0.3,
          pointRadius: 3,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display:false } },
        scales: {
          x: { grid: { color: "#DDCEB2" }, ticks: { color:"#7A6A56", font:{size:11} } },
          y: { grid: { color: "#DDCEB2" }, ticks: { color:"#7A6A56", font:{size:11}, callback:v=>Math.round(v/1000)+"k" } },
        },
      },
    });
  },
};

document.addEventListener("click", function(){
  document.querySelectorAll(".select-panel").forEach(p=>{ p.style.display = "none"; });
  if (typeof App !== "undefined" && App.identityMenuOpen){
    App.identityMenuOpen = false;
    App.render();
  }
});

App.init();
</script>
</body>
</html>
